<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chaos Flappy</title><body style="margin:0;background:#050811;color:white;font-family:system-ui;display:grid;place-items:center;height:100vh"><div id="loading">Loading Chaos Flappy…</div><script>(async()=>{try{const names=[1,2,3,4,5,6,7,8].map(n=>`chunk${n}.txt`);const b=(await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('missing '+n);return r.text()})))).join('').replace(/\s/g,'');const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close()}catch(e){document.getElementById('loading').textContent='Could not load Chaos Flappy: '+e}})();</script>
