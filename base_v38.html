<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luau Study</title>
<style>
html,body{margin:0;background:#0d1016;color:#f4f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%;}
#boot{padding:18px;color:#aeb7c6;font-size:13px;}
</style>
</head>
<body>
<div id="boot">Loading Luau Study v38…</div>
<script>
(async function(){
  try{
    const response=await fetch("base-v37.html?v=38",{cache:"no-store"});
    if(!response.ok) throw new Error("Could not load base trainer: "+response.status);
    let source=await response.text();

    const patchStyle=`<style id="v38-mobile-patch">
@media (max-width:600px){
  .free-code-card .code-editor{padding-bottom:104px!important;}
  .free-code-card .free-code-status{display:flex!important;position:absolute!important;left:8px!important;right:8px!important;bottom:50px!important;width:auto!important;max-width:none!important;min-height:34px!important;box-sizing:border-box!important;align-items:center!important;justify-content:flex-start!important;gap:7px!important;padding:5px 7px!important;border:1px solid rgba(130,155,190,.16)!important;border-radius:9px!important;background:rgba(19,25,35,.86)!important;backdrop-filter:blur(8px)!important;color:#8293ad!important;pointer-events:auto!important;z-index:40!important;}
  .free-code-card .free-code-status>span{flex:0 0 auto!important;font-size:9px!important;}
  .free-code-card .free-run-context-label{flex:1 1 auto!important;min-width:0!important;justify-content:flex-end!important;gap:5px!important;font-size:9px!important;}
  .free-code-card .free-run-context{flex:0 1 142px!important;width:142px!important;min-width:0!important;max-width:142px!important;height:27px!important;padding:2px 23px 2px 7px!important;font-size:10px!important;border-radius:7px!important;}
  .free-code-card .editor-tools{left:8px!important;right:8px!important;bottom:8px!important;width:auto!important;justify-content:flex-end!important;gap:5px!important;z-index:41!important;}
  .free-code-card .editor-tool{width:38px!important;min-width:38px!important;height:34px!important;padding:0!important;}
  .free-code-card .editor-tool .tool-label{display:none!important;}
  .free-code-card .editor-tool .tool-icon{font-size:15px!important;}
}
.mobile-suggestion-accept{display:none;}
@media (hover:none) and (pointer:coarse){
  .inline-ghost-suggestion{overflow:visible!important;}
  .mobile-suggestion-accept{display:inline-flex!important;position:absolute!important;left:calc(100% + 6px)!important;top:50%!important;transform:translateY(-50%)!important;align-items:center!important;justify-content:center!important;width:22px!important;height:19px!important;box-sizing:border-box!important;border:1px solid rgba(166,181,202,.20)!important;border-radius:6px!important;background:rgba(52,63,78,.48)!important;color:rgba(218,228,240,.70)!important;-webkit-text-fill-color:rgba(218,228,240,.70)!important;box-shadow:0 2px 8px rgba(0,0,0,.16)!important;backdrop-filter:blur(5px)!important;font:800 10px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;pointer-events:none!important;}
  .inline-ghost-suggestion:active .mobile-suggestion-accept{background:rgba(78,95,116,.66)!important;color:rgba(238,244,251,.88)!important;-webkit-text-fill-color:rgba(238,244,251,.88)!important;}
}
</style>`;

    const patchScript=`<script id="v38-mobile-patch-script">(function(){
      function decorate(root){
        (root||document).querySelectorAll('.inline-ghost-suggestion').forEach(function(btn){
          if(btn.querySelector('.mobile-suggestion-accept')) return;
          var chip=document.createElement('span');
          chip.className='mobile-suggestion-accept';
          chip.setAttribute('aria-hidden','true');
          chip.textContent='✓';
          btn.appendChild(chip);
        });
      }
      decorate(document);
      new MutationObserver(function(){decorate(document);}).observe(document.documentElement,{subtree:true,childList:true});
      document.querySelectorAll('.editor-hint').forEach(function(h){
        if(h.textContent.includes('Tab accepts a prediction')) h.textContent=h.textContent.replace('Tab accepts a prediction','Tab / tap ✓ accepts a prediction');
      });
    })();<\/script>`;

    source=source.replace("</head>",patchStyle+"\n</head>");
    source=source.replace("</body>",patchScript+"\n</body>");

    document.open();
    document.write(source);
    document.close();
  }catch(err){
    document.getElementById('boot').textContent='Could not load Luau Study v38: '+err.message;
  }
})();
</script>
</body>
</html>
