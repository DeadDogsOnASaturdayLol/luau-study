<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loading Arcade Nexus…</title>
<style>
html,body{margin:0;min-height:100%;background:#080b16;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;box-sizing:border-box}
.card{width:min(480px,100%);padding:28px;box-sizing:border-box;border:1px solid #29334f;border-radius:22px;background:#11182d}
.spinner{font-size:48px;display:inline-block;animation:spin 1s linear infinite}
h1{font-size:24px;margin:12px 0 8px}p{color:#aeb9d4;line-height:1.5;margin:0}#error{color:#ff8fa3;white-space:pre-wrap;margin-top:14px;font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<main><div class="card"><div class="spinner">🕹️</div><h1>Loading Arcade Nexus</h1><p id="status">Preparing the mobile-ready arcade…</p><div id="error"></div></div></main>
<script>
(async()=>{
 const status=document.getElementById("status");
 const error=document.getElementById("error");
 try{
  if(!("DecompressionStream" in window)) throw new Error("This browser is missing built-in gzip support. Update Safari/Chrome and try again.");
  const base="https://raw.githubusercontent.com/DeadDogsOnASaturdayLol/luau-study/main/arcade/data/";
  const names=["01.txt","02.txt","03.txt","04.txt","05.txt","06.txt"];
  status.textContent="Downloading arcade…";
  const parts=await Promise.all(names.map(async name=>{
    const response=await fetch(base+name+"?v=mobile-v2",{cache:"no-store"});
    if(!response.ok) throw new Error("Could not load "+name+" (HTTP "+response.status+")");
    return (await response.text()).trim();
  }));
  const b64=parts.join("");
  const binary=atob(b64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  status.textContent="Starting games…";
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html=await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
 }catch(err){
  status.textContent="Couldn’t start the arcade.";
  error.textContent=String(err&&err.message?err.message:err);
 }
})();
</script>
</body>
</html>
